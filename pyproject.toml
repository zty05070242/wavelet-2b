[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wavelet-2b"
version = "0.2.0"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = [
    "backtester",
    "backtester_scaled",
    "chart",
    "data_loader",
    "position_sizer",
    "backtest_metrics",
    "pivot_detector",
    "regime_hmm",
    "run_comparison",
    "run_regime_analysis",
    "wavelet_denoiser",
    "wavelet_kalman_calibrate",
]
packages = ["strategy_folder"]
